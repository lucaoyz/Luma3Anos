<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>LuMa 3 Anos </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Figtree:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  color-scheme: dark;
  --bg: #351300;
  --surface: #312516;
  --surface-2: #42291e;
  --line: #59392d;
  --fg: #ebe9f7;
  --muted: #9a98ba;
  --gold: #ffc857;
  --gold-ink: #2a1e00;
  --rose: #ff5c93;
  --ok: #5fd6a0;
  --ok-ink: #06251a;
  --bad: #ff7a7a;
  --d-azul: #3f6fe0;
  --d-vermelha: #d9455f;
  --d-dourada: #e3b13f;
  --d-verde: #3ea67a;
  --display: "Chakra Petch", system-ui, sans-serif;
  --body: "Figtree", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
}
.wrap {
  max-width: 560px;
  margin: 0 auto;
  padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
h1 { font-size: clamp(2rem, 9vw, 2.75rem); line-height: 1.05; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 1.5rem; line-height: 1.2; font-weight: 600; }
h3 { font-size: 1.2rem; line-height: 1.3; font-weight: 600; }
p { margin: 0; }
.kicker { font-family: var(--mono); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* hero */
.hero { display: flex; flex-direction: column; gap: 14px; }
.months { display: grid; grid-template-columns: repeat(18, 1fr); gap: 3px; margin-top: 6px; }
.months span { height: 9px; border-radius: 2px; background: var(--rose); opacity: 0.85; }
.months span.next { background: transparent; border: 1px dashed var(--gold); opacity: 1; animation: pulse 1.8s ease-in-out infinite; }
.months-cap { display: flex; justify-content: space-between; gap: 12px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
@keyframes pulse { 50% { background: rgba(255, 200, 87, 0.35); } }

/* buttons */
.btn {
  font: 600 1rem var(--display);
  background: var(--gold); color: var(--gold-ink);
  border: 0; border-radius: 6px; padding: 12px 20px; cursor: pointer;
}
.btn:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
.link { background: none; border: 0; padding: 4px 0; color: var(--muted); font: 500 0.9rem var(--body); text-decoration: underline; cursor: pointer; }

/* section titles */
.section { margin-top: 36px; display: flex; flex-direction: column; gap: 12px; }

/* levels */
.levels { display: flex; flex-direction: column; gap: 8px; }
.level {
  display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 14px;
  width: 100%; text-align: left; font: inherit; color: inherit;
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; cursor: pointer;
}
.level .n { font: 700 1.5rem var(--display); color: var(--muted); text-align: center; }
.level .t { font: 600 1.05rem var(--display); }
.level .s { font-size: 0.85rem; color: var(--muted); }
.level .st { font: 500 11px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.level.open { border-color: var(--gold); background: var(--surface-2); }
.level.open .n, .level.open .st { color: var(--gold); }
.level.done .n, .level.done .st { color: var(--ok); }
.level:disabled { opacity: 0.45; cursor: not-allowed; }

/* vault */
.vault { display: flex; flex-direction: column; gap: 8px; }
.slot { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start; padding: 12px 14px; border: 1px dashed var(--line); border-radius: 8px; min-width: 0; }
.slot .k { font: 500 12px var(--mono); color: var(--muted); padding-top: 3px; }
.slot .txt { font-family: var(--mono); font-size: 0.9rem; overflow-wrap: anywhere; }
.slot .txt b { color: var(--gold); }
.slot.on { border: 1px solid var(--gold); background: var(--surface); }
.slot.on .k { color: var(--gold); }
.slot:not(.on) .txt { color: var(--muted); letter-spacing: 0.3em; }

/* stage */
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 22px; }
.stage-head { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
.play { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.prog { font: 500 12px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.q { font-size: 1.3rem; }
.msg { min-height: 1.5em; color: var(--muted); font-size: 0.95rem; }
.msg.ok { color: var(--ok); }
.msg.bad { color: var(--bad); }
.opts { display: grid; gap: 8px; }
.opt {
  font: 500 1rem var(--body); color: var(--fg); text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; cursor: pointer;
}
.opt:hover:not(:disabled) { border-color: var(--gold); }
.opt.right { border-color: var(--ok); background: rgba(95, 214, 160, 0.14); }
.opt.wrong { border-color: var(--bad); color: var(--muted); text-decoration: line-through; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row input {
  flex: 1 1 180px; min-width: 0; font: 500 1rem var(--body); color: var(--fg);
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px;
}
.hint { font-size: 0.95rem; color: var(--gold); }

/* word search */
.ws { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; width: 100%; max-width: 420px; margin: 0 auto; }
.cell { aspect-ratio: 1; min-width: 0; padding: 0; border: 0; border-radius: 4px; background: var(--surface); color: var(--fg); font: 500 15px var(--mono); cursor: pointer; }
.cell.sel { background: var(--gold); color: var(--gold-ink); }
.cell.found { background: var(--rose); color: #fff; }
.words { display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: center; font: 500 13px var(--mono); letter-spacing: 0.06em; }
.words span.f { color: var(--ok); text-decoration: line-through; }

/* doors */
.clues { margin: 0; padding-left: 1.1em; display: grid; gap: 4px; color: var(--muted); }
.doors { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 10px; }
.door-box { display: flex; flex-direction: column; gap: 6px; align-items: stretch; min-width: 0; }
.door { position: relative; aspect-ratio: 3 / 5; width: 100%; border: 0; border-radius: 8px 8px 2px 2px; background: var(--c); cursor: pointer; display: grid; place-items: center; }
.door::after { content: ""; position: absolute; right: 12%; top: 52%; width: 9px; height: 9px; border-radius: 50%; background: rgba(0, 0, 0, 0.45); }
.door:disabled { cursor: default; }
.door.no { filter: grayscale(0.8) brightness(0.55); }
.door.yes { background: #05060d; box-shadow: inset 0 0 0 2px var(--gold); }
.door.yes::after { display: none; }
.door svg { width: 46%; color: var(--gold); }
.door-name { text-align: center; font: 500 12px var(--mono); letter-spacing: 0.06em; color: var(--muted); }
.shake { animation: shake 0.3s; }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

/* termo em quarteto */
.tclues { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; background: var(--surface); }
.tclues summary { cursor: pointer; font: 500 12px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); }
.tclues .clues { margin-top: 10px; font-size: 0.92rem; }
.tgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 12px; }
.tb { display: grid; gap: 3px; min-width: 0; align-content: start; }
.tb-h { font: 500 11px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.tr { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; }
.tc { aspect-ratio: 1; min-width: 0; display: grid; place-items: center; font: 700 clamp(13px, 4vw, 18px) var(--display); background: var(--surface); border: 1px solid var(--line); border-radius: 4px; }
.tc.cur { border-color: var(--fg); }
.tc.c { background: var(--ok); color: var(--ok-ink); border-color: transparent; }
.tc.p { background: var(--gold); color: var(--gold-ink); border-color: transparent; }
.tc.a { background: var(--surface-2); color: var(--muted); border-color: transparent; }
.kb { display: grid; gap: 6px; }
.kr { display: flex; gap: 4px; justify-content: center; }
.key { flex: 1 1 0; min-width: 0; max-width: 40px; height: 46px; padding: 0; border: 0; border-radius: 6px; background: var(--surface-2); color: var(--fg); font: 600 15px var(--display); cursor: pointer; }
.key.w { flex: 1.5 1 0; max-width: 58px; }
.key:active { background: var(--line); }

/* reward */
.reward { margin-top: 24px; padding: 18px; border: 1px solid var(--gold); border-radius: 8px; background: var(--surface); display: flex; flex-direction: column; gap: 12px; }
.reward .clue { font-family: var(--mono); font-size: 1rem; overflow-wrap: anywhere; }

/* final */
.ticket { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; padding: 18px; border: 1px dashed var(--gold); border-radius: 8px; background: var(--surface); }
.ticket > div { min-width: 0; }
.ticket > :last-child { grid-column: 1 / -1; }
.dest { font: 700 1.4rem var(--display); overflow-wrap: anywhere; }
.final-msg { padding: 18px; background: var(--surface-2); border-radius: 8px; border: 1px solid var(--rose); display: flex; flex-direction: column; gap: 10px; }

.foot { margin-top: 40px; display: flex; justify-content: space-between; gap: 12px; align-items: center; font: 500 12px var(--mono); color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
  .months span.next, .shake { animation: none; }
}
</style>

<div class="wrap" id="app"></div>

<script>
const CONFIG = {
  nome: "Manu",
  nomeCompleto: "Manuzinha, meu amor",
  destino: "Serra Negra",
  datas: "4 a 6 de dezembro",
  fases: [
    {
      nome: "Quiz sobre nós", tipo: "Será que nos conhece tão bem? rs",
      instrucao: "Cinco perguntas sobre a nossa história. Errar não custa nada, é só tentar de novo.",
      perguntas: [
        { p: "Em que mês e ano nos conhecemos?", o: ["Novembro/2022", "Dezembro/2021", "Setembro/2022", "14/junho/2005"], c: 2 },
        { p: "Qual é a minha comida favorita?", o: ["Pizza", "Hambúrguer", "Sushi", "Lasanha"], c: 1 },
        { p: "Onde mais fazemos amor?", o: ["Cama", "Botside de summoners rift", "Sofa", "Carro"], c: 1 },
        { p: "Qual lugar a gente mais quer conhecer juntos?", o: ["Estragos Fudidos", "Asia", "Sumaré/Sp", "Malvidas"], c: 1 },
        { p: "Agora, a mais dificil de todas, quantas fotos temos juntos?", o: ["67", "5023", "1000000", "3267"], c: 3 }
      ],
      palavra: "VINHO",
      pista: "Para brindar os três anos, vai ter uma taça de _____."
    },
    {
      nome: "Três enigmas indecifráveis", tipo: "Os enigmas mais enigmáticas da vida",
      instrucao: "Três enigmas. Se errar duas vezes, uma dica surge do além.",
      charadas: [
        { p: "De risadinha em risadinha, vai caindo a ...", r: ["calcinha"], dica: "Quinta feira é igual calcinha, não é o que a gente quer, mas tá perto." },
        { p: "O que você quer tomar para gente ficar de dengo?", r: ["vinho"], dica: "Tem alcool e é de uva" },
        { p: "O que é branco, da ponta vermelha e acaba na boca?", r: ["cigarro"], dica: "Não pense besteira meu amor!!! É algo que abandonamos a 11 meses." }
      ],
      palavra: "CHALE",
      pista: "Não vamos dormir em casa. Já reservei o nosso _____."
    },
    {
      nome: "Palavras do Coração", tipo: "Caça palavras da turma da monica",
      instrucao: "Ache as seis palavras. Toque na primeira letra e depois na última.",
      palavras: ["AMOR", "BEIJO", "ABRACO", "CARINHO", "FELIZ", "JUNTOS"],
      palavra: "SERRA",
      pista: "Lugar alto, com montanhas, curvas na estrada e ar fresco. Nosso destino fica numa _____."
    },
    {
      nome: "As chaves do Cofre", tipo: "Adivinhe a porta",
      instrucao: "Uma porta esconde a chave em cada rodada. Use as dicas para deduzir qual.",
      rodadas: [
        { portas: ["azul", "vermelha", "dourada"], chave: 2,
          dicas: ["A chave não está na porta azul.", "A chave está na porta que não faz parte do RGB"] },
        { portas: ["verde", "azul", "vermelha", "dourada"], chave: 1,
          dicas: ["A chave está em uma das portas.", "A chave não está na primeira porta.", "A porta certa fica ao lado da vermelha."] }
      ],
      palavra: "NEGRA",
      pista: "A cor do céu sem lua e sem estrelas. O destino leva esse nome: _____."
    },
    {
      nome: "TERMO", tipo: "O Temido Termo.",
      instrucao: "Quatro palavras de 5 letras, todas ao mesmo tempo. Cada pista que você ganhou leva a uma delas. São 9 tentativas."
    }
  ],
  mensagemFinal: "Você abriu o cofre meu bem. Você ganhou uma viagem comigo <3, a viagem já está reservada e o presente de 3 anos começa em 4 de dezembro. Obrigado pelos 2 anos e 11 meses. Estou muito ansioso para nosso terceiro ano juntos. Eu te amo meu amor, para toda vida."
};

/* ============================================================ */
const app = document.getElementById("app");
const TOTAL = CONFIG.fases.length;
const CLUES = CONFIG.fases.slice(0, TOTAL - 1);
let state = load();
let view = { name: "home", i: 0 };

function load() {
  try {
    const s = JSON.parse(localStorage.getItem("missao211v2"));
    if (s && Array.isArray(s.done) && s.done.length === TOTAL) return s;
  } catch (e) {}
  return { done: Array(TOTAL).fill(false) };
}
function save() { try { localStorage.setItem("missao211v2", JSON.stringify(state)); } catch (e) {} }

function go(name, i) {
  if (window.__kh) { document.removeEventListener("keydown", window.__kh); window.__kh = null; }
  view = { name, i: i || 0 }; window.scrollTo(0, 0); render();
}
function norm(s) { return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9 ]/g, "").trim(); }
function mulberry(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function nextOpen() { return state.done.findIndex(d => !d); }

function render() {
  if (view.name === "home") renderHome();
  else if (view.name === "stage") renderStage(view.i);
  else renderFinal();
}

/* ---------- home ---------- */
function vaultHTML(reveal) {
  return CLUES.map((f, i) => {
    const on = state.done[i];
    const txt = on ? (reveal ? f.pista.replace("___", `<b>${f.palavra}</b>`) : f.pista) : "• • • • • • • •";
    return `<div class="slot ${on ? "on" : ""}"><span class="k">P${i + 1}</span><span class="txt">${txt}</span></div>`;
  }).join("");
}

function renderHome() {
  const open = nextOpen();
  const segs = Array.from({ length: 36 }, (_, k) => `<span class="${k === 35 ? "next" : ""}"></span>`).join("");
  const levels = CONFIG.fases.map((f, i) => {
    const done = state.done[i], isOpen = i === open;
    const cls = done ? "done" : isOpen ? "open" : "";
    const st = done ? "feito" : isOpen ? "jogar" : "trancado";
    return `<button class="level ${cls}" data-stage="${i}" ${!done && !isOpen ? "disabled" : ""}>
      <span class="n">${i + 1}</span><span><div class="t">${f.nome}</div><div class="s">${f.tipo}</div></span><span class="st">${st}</span></button>`;
  }).join("");
  const allDone = open === -1;
  app.innerHTML = `
    <header class="hero">
      <p class="kicker">2 anos e 11 meses</p>
      <h1>O cofre dos três anos</h1>
      <p class="muted">${CONFIG.nome}, o cofre do presente de 3 anos está trancado. Quatro desafios guardam quatro pistas. Cada pista leva a uma palavra, e as quatro palavras abrem o cofre.</p>
      <div>
        <div class="months" aria-hidden="true">${segs}</div>
        <div class="months-cap"><span>35 de 36 meses</span><span>falta 1 para o nível 3</span></div>
      </div>
      ${allDone
        ? `<button class="btn" data-final>Ver o presente</button>`
        : `<button class="btn" data-stage="${open}">${state.done.some(Boolean) ? "Continuar" : "Começar"}</button>`}
    </header>
    <section class="section"><h2>Os desafios</h2><div class="levels">${levels}</div></section>
    <section class="section"><h2>Cofre de pistas</h2><div class="vault">${vaultHTML(false)}</div></section>
    <div class="foot"><span>Eu te amo!</span><button class="link" id="reset">Recomeçar do zero</button></div>`;
  app.querySelectorAll("[data-stage]").forEach(b => b.onclick = () => go("stage", +b.dataset.stage));
  const fb = app.querySelector("[data-final]"); if (fb) fb.onclick = () => go("final");
  const rb = document.getElementById("reset");
  rb.onclick = () => {
    if (rb.dataset.sure) { state = { done: Array(TOTAL).fill(false) }; save(); render(); }
    else { rb.dataset.sure = "1"; rb.textContent = "Toque de novo para apagar o progresso"; }
  };
}

/* ---------- stage ---------- */
function renderStage(i) {
  const f = CONFIG.fases[i];
  app.innerHTML = `
    <div class="top"><button class="link" id="back">← Voltar</button><span class="kicker">Nível ${i + 1} de ${TOTAL}</span></div>
    <div class="stage-head"><h2>${f.nome}</h2><p class="muted">${f.instrucao}</p></div>
    <div class="play" id="play"></div>
    <div id="reward" hidden></div>`;
  document.getElementById("back").onclick = () => go("home");
  const play = document.getElementById("play");
  const complete = () => {
    state.done[i] = true; save();
    const isLast = i === TOTAL - 1;
    const r = document.getElementById("reward");
    r.hidden = false;
    r.innerHTML = isLast
      ? `<div class="reward"><span class="kicker">Cofre aberto</span><p class="clue">As quatro palavras abriram o cofre.</p>
          <button class="btn" id="next">Ver o presente</button></div>`
      : `<div class="reward"><span class="kicker">Pista desbloqueada</span><p class="clue">${f.pista}</p>
          <p class="muted" style="font-size:.9rem">A resposta tem 5 letras. Guarde essa pista para o Termo final.</p>
          <button class="btn" id="next">Voltar ao jogo</button></div>`;
    document.getElementById("next").onclick = () => go(isLast ? "final" : "home");
    r.scrollIntoView({ behavior: "smooth", block: "center" });
  };
  [quiz, riddles, wordsearch, doors, termo][i](play, complete, f);
}

/* ---------- 1. quiz ---------- */
function quiz(el, done, f) {
  const Q = f.perguntas; let i = 0;
  function draw() {
    const q = Q[i];
    el.innerHTML = `<div class="prog">Pergunta ${i + 1} de ${Q.length}</div><h3 class="q">${q.p}</h3>
      <div class="opts">${q.o.map((t, k) => `<button class="opt" data-k="${k}">${t}</button>`).join("")}</div>
      <p class="msg" id="msg" role="status"></p>`;
    const msg = document.getElementById("msg");
    el.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      if (+b.dataset.k === q.c) {
        b.classList.add("right");
        el.querySelectorAll(".opt").forEach(x => x.disabled = true);
        msg.className = "msg ok"; msg.textContent = "Isso mesmo!";
        setTimeout(() => { i++; i < Q.length ? draw() : (el.innerHTML = `<p class="msg ok">Quiz completo.</p>`, done()); }, 700);
      } else {
        b.classList.add("wrong"); b.disabled = true;
        msg.className = "msg bad"; msg.textContent = "Quase. Tenta outra.";
      }
    });
  }
  draw();
}

/* ---------- 2. charadas ---------- */
function riddles(el, done, f) {
  const R = f.charadas; let i = 0;
  function draw() {
    const r = R[i]; let tries = 0;
    el.innerHTML = `<div class="prog">Charada ${i + 1} de ${R.length}</div><h3 class="q">${r.p}</h3>
      <form id="rf" class="row"><label class="sr" for="ans">Sua resposta</label>
        <input id="ans" autocomplete="off" autocapitalize="none" placeholder="Sua resposta"><button class="btn" type="submit">Responder</button></form>
      <p class="msg" id="msg" role="status"></p>
      <div><button class="link" id="hintBtn" type="button" hidden>Ver dica</button><p class="hint" id="hintTxt" hidden>${r.dica}</p></div>`;
    const msg = document.getElementById("msg"), inp = document.getElementById("ans");
    document.getElementById("hintBtn").onclick = () => { document.getElementById("hintTxt").hidden = false; };
    document.getElementById("rf").onsubmit = e => {
      e.preventDefault();
      const v = norm(inp.value); if (!v) return;
      const ok = r.r.some(a => { const n = norm(a); return v === n || (n.length > 3 && v.includes(n)); });
      if (ok) {
        msg.className = "msg ok"; msg.textContent = "Acertou!"; inp.disabled = true;
        setTimeout(() => { i++; i < R.length ? draw() : (el.innerHTML = `<p class="msg ok">Todas as charadas resolvidas.</p>`, done()); }, 800);
      } else {
        tries++; msg.className = "msg bad"; msg.textContent = "Opsss. Não é essa meu amor";
        inp.classList.remove("shake"); void inp.offsetWidth; inp.classList.add("shake");
        if (tries >= 2) document.getElementById("hintBtn").hidden = false;
      }
    };
    inp.focus();
  }
  draw();
}

/* ---------- 3. caça-palavras ---------- */
function wordsearch(el, done, f) {
  const S = 10, rnd = mulberry(2111), W = f.palavras;
  const grid = Array.from({ length: S }, () => Array(S).fill(""));
  const dirs = [[0, 1], [1, 0], [1, 1]];
  [...W].sort((a, b) => b.length - a.length).forEach(w => {
    for (let t = 0; t < 400; t++) {
      const [dr, dc] = dirs[Math.floor(rnd() * dirs.length)];
      const r = Math.floor(rnd() * S), c = Math.floor(rnd() * S);
      const er = r + dr * (w.length - 1), ec = c + dc * (w.length - 1);
      if (er >= S || ec >= S) continue;
      let ok = true;
      for (let k = 0; k < w.length; k++) { const x = grid[r + dr * k][c + dc * k]; if (x && x !== w[k]) { ok = false; break; } }
      if (!ok) continue;
      for (let k = 0; k < w.length; k++) grid[r + dr * k][c + dc * k] = w[k];
      return;
    }
  });
  const abc = "ABCDEFGHIJLMNOPRSTUV";
  for (let r = 0; r < S; r++) for (let c = 0; c < S; c++) if (!grid[r][c]) grid[r][c] = abc[Math.floor(rnd() * abc.length)];
  const found = new Set(), foundCells = new Set(); let start = null;
  function draw() {
    el.innerHTML = `<div class="ws" id="ws"></div><div class="words" id="wl"></div><p class="msg" id="msg" role="status"></p>`;
    const ws = document.getElementById("ws");
    for (let r = 0; r < S; r++) for (let c = 0; c < S; c++) {
      const b = document.createElement("button");
      b.className = "cell" + (foundCells.has(r + "," + c) ? " found" : "") + (start && start[0] === r && start[1] === c ? " sel" : "");
      b.textContent = grid[r][c]; b.setAttribute("aria-label", `linha ${r + 1} coluna ${c + 1} letra ${grid[r][c]}`);
      b.onclick = () => tap(r, c); ws.appendChild(b);
    }
    document.getElementById("wl").innerHTML = W.map(w => `<span class="${found.has(w) ? "f" : ""}">${w}</span>`).join("");
  }
  function tap(r, c) {
    const msg = () => document.getElementById("msg");
    if (!start) { start = [r, c]; draw(); return; }
    const dr = r - start[0], dc = c - start[1];
    if ((dr === 0 && dc === 0) || !(dr === 0 || dc === 0 || Math.abs(dr) === Math.abs(dc))) { start = null; draw(); return; }
    const n = Math.max(Math.abs(dr), Math.abs(dc)) + 1, sr = Math.sign(dr), sc = Math.sign(dc), cells = [];
    let str = "";
    for (let k = 0; k < n; k++) { const rr = start[0] + sr * k, cc = start[1] + sc * k; cells.push(rr + "," + cc); str += grid[rr][cc]; }
    const rev = [...str].reverse().join("");
    const hit = W.find(w => !found.has(w) && (w === str || w === rev));
    start = null;
    if (hit) {
      found.add(hit); cells.forEach(x => foundCells.add(x)); draw();
      msg().className = "msg ok"; msg().textContent = "Achou " + hit + ".";
      if (found.size === W.length) setTimeout(done, 700);
    } else { draw(); msg().className = "msg bad"; msg().textContent = "Essa não é uma das palavras."; }
  }
  draw();
}

/* ---------- 4. adivinhe a porta ---------- */
const KEY_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="12" r="4"/><path d="M12 12h9M18 12v4M21 12v3"/></svg>`;
function doors(el, done, f) {
  const R = f.rodadas; let i = 0;
  function draw() {
    const r = R[i];
    el.innerHTML = `<div class="prog">Rodada ${i + 1} de ${R.length}</div>
      <ul class="clues">${r.dicas.map(d => `<li>${d}</li>`).join("")}</ul>
      <div class="doors" style="--n:${r.portas.length}">${r.portas.map((p, k) =>
        `<div class="door-box"><button class="door" style="--c:var(--d-${p})" data-k="${k}" aria-label="Porta ${p}"></button><span class="door-name">${p}</span></div>`).join("")}</div>
      <p class="msg" id="msg" role="status"></p>`;
    const msg = document.getElementById("msg");
    el.querySelectorAll(".door").forEach(b => b.onclick = () => {
      const k = +b.dataset.k;
      if (k === r.chave) {
        el.querySelectorAll(".door").forEach(x => x.disabled = true);
        b.classList.add("yes"); b.innerHTML = KEY_SVG;
        msg.className = "msg ok"; msg.textContent = "A chave estava aqui.";
        setTimeout(() => { i++; i < R.length ? draw() : (el.innerHTML = `<p class="msg ok">Todas as portas abertas.</p>`, done()); }, 1100);
      } else {
        b.classList.add("no", "shake"); b.disabled = true;
        msg.className = "msg bad"; msg.textContent = "Vazia. Releia as dicas.";
      }
    });
  }
  draw();
}

/* ---------- 5. termo em quarteto ---------- */
function termo(el, done) {
  const WORDS = CLUES.map(x => x.palavra.toUpperCase());
  const MAX = 9, KEYS = ["QWERTYUIOP", "ASDFGHJKL", "ZXCVBNM"];
  let guesses, cur, solvedAt, note = ["", ""], clueOpen = true;
  const solvedAll = () => solvedAt.every(x => x !== -1);
  function reset() { guesses = []; cur = ""; solvedAt = WORDS.map(() => -1); note = ["", ""]; }

  function evalGuess(g, w) {
    const res = Array(5).fill("a"), left = {};
    for (let k = 0; k < 5; k++) { if (g[k] === w[k]) res[k] = "c"; else left[w[k]] = (left[w[k]] || 0) + 1; }
    for (let k = 0; k < 5; k++) if (res[k] !== "c" && left[g[k]]) { res[k] = "p"; left[g[k]]--; }
    return res;
  }
  function boardHTML(b) {
    const w = WORDS[b], rows = [];
    for (let r = 0; r < MAX; r++) {
      let cells;
      const frozen = solvedAt[b] !== -1 && r > solvedAt[b];
      if (r < guesses.length && !frozen) {
        const res = evalGuess(guesses[r], w);
        cells = [...guesses[r]].map((ch, k) => `<div class="tc ${res[k]}">${ch}</div>`).join("");
      } else if (r === guesses.length && solvedAt[b] === -1) {
        cells = Array.from({ length: 5 }, (_, k) => `<div class="tc ${cur[k] ? "cur" : ""}">${cur[k] || ""}</div>`).join("");
      } else cells = `<div class="tc"></div>`.repeat(5);
      rows.push(`<div class="tr">${cells}</div>`);
    }
    return `<div class="tb"><div class="tb-h">Palavra ${b + 1}${solvedAt[b] !== -1 ? " ✓" : ""}</div>${rows.join("")}</div>`;
  }
  function draw() {
    const lost = guesses.length >= MAX && !solvedAll();
    const n = solvedAt.filter(x => x !== -1).length;
    el.innerHTML = `
      <details class="tclues"><summary>Pistas das palavras</summary><ol class="clues">${CLUES.map(x => `<li>${x.pista}</li>`).join("")}</ol></details>
      <div class="prog">Tentativa ${Math.min(guesses.length + 1, MAX)} de ${MAX} · ${n} de ${WORDS.length} palavras</div>
      <div class="tgrid">${WORDS.map((_, b) => boardHTML(b)).join("")}</div>
      <p class="msg ${note[1]}" id="msg" role="status">${note[0]}</p>
      ${lost ? `<button class="btn" id="again">Tentar de novo</button>` : ""}
      <div class="kb">${KEYS.map((row, ri) => `<div class="kr">${ri === 2 ? `<button class="key w" data-k="ENTER" aria-label="Enviar">↵</button>` : ""}${[...row].map(ch => `<button class="key" data-k="${ch}">${ch}</button>`).join("")}${ri === 2 ? `<button class="key w" data-k="BACK" aria-label="Apagar">⌫</button>` : ""}</div>`).join("")}</div>
      <p class="muted" style="font-size:.85rem">Verde: letra certa no lugar certo. Dourado: a letra existe, em outro lugar. Cinza: não tem.</p>`;
    const d = el.querySelector(".tclues"); d.open = clueOpen; d.ontoggle = () => { clueOpen = d.open; };
    el.querySelectorAll(".key").forEach(b => b.onclick = () => press(b.dataset.k));
    const ag = document.getElementById("again"); if (ag) ag.onclick = () => { reset(); draw(); };
  }
  function press(k) {
    if (solvedAll() || guesses.length >= MAX) return;
    if (k === "BACK") { cur = cur.slice(0, -1); note = ["", ""]; }
    else if (k === "ENTER") {
      if (cur.length < 5) note = ["Faltam letras. Use 5.", "bad"];
      else {
        guesses.push(cur);
        WORDS.forEach((w, b) => { if (solvedAt[b] === -1 && cur === w) solvedAt[b] = guesses.length - 1; });
        cur = "";
        if (solvedAll()) { note = ["Todas as palavras. O cofre abriu.", "ok"]; draw(); setTimeout(done, 1100); return; }
        note = guesses.length >= MAX ? ["Acabaram as tentativas.", "bad"] : ["", ""];
      }
    } else if (cur.length < 5) { cur += k; note = ["", ""]; }
    draw();
  }
  window.__kh = e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === "Enter") { e.preventDefault(); press("ENTER"); }
    else if (e.key === "Backspace") press("BACK");
    else if (/^[a-zA-Z]$/.test(e.key)) press(e.key.toUpperCase());
  };
  document.addEventListener("keydown", window.__kh);
  reset(); draw();
}
